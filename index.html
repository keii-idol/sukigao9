.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.prev{background:#fff;color:var(--ink)}.next,.primary{background:#74cef3;color:#10364a}.next:disabled{opacity:.4}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
.result{display:none}.result h2{text-align:center}.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#fff;padding:9px;border-radius:18px}
.nine img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}
.roundBadge{text-align:center;font-weight:700;color:#338cb4;margin-bottom:4px}
.about{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.75}.about summary{cursor:pointer;font-weight:700}.aboutbox{margin-top:7px;padding:10px 12px;background:#ffffffb8;border:1px solid #cfe8f4;border-radius:12px}.aboutbox p{margin:0 0 7px}.aboutbox p:last-child{margin-bottom:0}
