<style>
:root{--blue:#9edcf7;--blue2:#e9f8ff;--ink:#18364a;--muted:#6b8494}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#f7fdff,#e9f8ff);color:var(--ink)}
.app{max-width:620px;margin:auto;min-height:100vh;padding:8px 10px 18px}

.bar{height:6px;background:#d9eef8;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--blue);width:0;transition:.25s}
.status{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:4px 2px 5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{position:relative;border:2px solid transparent;background:#fff;border-radius:13px;overflow:hidden;box-shadow:0 2px 10px #75b5d326;cursor:pointer;height:min(25.2vh,210px);display:flex;align-items:stretch;justify-content:center}

.card.sel{border-color:#58bce8;box-shadow:0 0 0 3px #bcecff,0 5px 20px #4baed63d}
.heart{position:absolute;right:5px;top:5px;width:28px;height:28px;border-radius:50%;background:#ffffffde;display:grid;place-items:center;font-size:19px;color:#8aa9b9;box-shadow:0 2px 8px #0002}
.card.sel .heart{color:#35aee4}.nav{display:flex;gap:7px;margin-top:7px}.nav button,.primary{border:0;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;flex:1}
.prev{background:#fff;color:var(--ink)}.next,.primary{background:#74cef3;color:#10364a}.next:disabled{opacity:.4}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
.result{display:none}.result h2{text-align:center}.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#fff;padding:9px;border-radius:18px}
.nine img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}
.roundBadge{text-align:center;font-weight:700;color:#338cb4;margin-bottom:4px}
.about{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.75}.about summary{cursor:pointer;font-weight:700}.aboutbox{margin-top:7px;padding:10px 12px;background:#ffffffb8;border:1px solid #cfe8f4;border-radius:12px}.aboutbox p{margin:0 0 7px}.aboutbox p:last-child{margin-bottom:0}

</style>

const KEY="junior_sukigao9_v2";
let state;
// 158人を9ブロックに分け、各ブロックから1人ずつ勝ち残らせてTOP9を作る。
// 各対戦は最大6人。勝者は次の5人（残りが少なければその人数）と再対戦する。
function makePools(){
 const ids=ALL.map(x=>x.id), pools=Array.from({length:9},()=>[]);
 ids.forEach((id,i)=>pools[i%9].push(id));
 return pools;
}
function fresh(){return {pool:0,pools:makePools(),offset:0,champion:null,selected:null,winners:[]}}
try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}
const byId=id=>ALL.find(x=>x.id===id);
function saveState(){localStorage.setItem(KEY,JSON.stringify(state))}
function currentGroup(){
 const pool=state.pools[state.pool]||[];
 if(state.champion===null) return pool.slice(0,6);
 return [state.champion,...pool.slice(state.offset,state.offset+5)];
}
function render(){
 if(state.pool>=9){showResult(state.winners);return}
 const pool=state.pools[state.pool], g=currentGroup();
 document.getElementById("roundBadge").textContent=`TOP9枠 ${state.pool+1} / 9　この中から1人`;
 const consumed=state.champion===null?Math.min(6,pool.length):Math.min(state.offset+5,pool.length);
 document.getElementById("progress").textContent=`候補 ${consumed} / ${pool.length}`;
 document.getElementById("chosen").textContent=state.selected===null?"1人選んでね":"1人選択中 ♡";
 document.getElementById("fill").style.width=((state.pool+(consumed/pool.length))/9*100)+"%";
 const grid=document.getElementById("grid");grid.innerHTML="";
 g.forEach(id=>{const x=byId(id),d=document.createElement("div");d.className="card"+(state.selected===id?" sel":"");

   d.onclick=()=>{state.selected=id;saveState();render()};grid.appendChild(d)});
 // 6枠を保つため空欄は作らず、最終対戦だけ2〜5人になる場合あり
 document.getElementById("prev").style.visibility="hidden";
 document.getElementById("next").disabled=state.selected===null;
 const more = state.champion===null ? pool.length>6 : state.offset+5<pool.length;
 document.getElementById("next").textContent=more?"この1人を勝ち残す →":(state.pool===8?"TOP9を完成 ♡":"この枠の勝者に決定 →");
}
function advance(){
 if(state.selected===null)return;
 const pool=state.pools[state.pool];
 if(state.champion===null){
   state.champion=state.selected; state.offset=6; state.selected=null;
   if(state.offset>=pool.length){finishPool();return}
 }else{
   state.champion=state.selected; state.offset+=5; state.selected=null;
   if(state.offset>=pool.length){finishPool();return}
 }
 saveState();render();scrollTo(0,0)
}
function finishPool(){
 state.winners.push(state.champion); state.pool++; state.offset=0; state.champion=null; state.selected=null;
 saveState(); if(state.pool>=9)showResult(state.winners); else {render();scrollTo(0,0)}
}
document.getElementById("next").onclick=advance;
function showResult(ids){
 state.final=ids.slice(0,9);saveState();
 document.getElementById("picker").style.display="none";document.getElementById("result").style.display="block";
 const n=document.getElementById("nine");n.innerHTML="";state.final.forEach(id=>{let im=document.createElement("img");im.src=byId(id).src;im.decoding="async";n.appendChild(im)})
}
document.getElementById("restart").onclick=()=>{if(confirm("最初からやり直す？")){localStorage.removeItem(KEY);state=fresh();location.reload()}};
document.getElementById("save").onclick=async()=>{
 const ids=state.final||[]; if(!ids.length)return;
 const S=1200,pad=42,gap=14,cell=(S-pad*2-gap*2)/3;
 const c=document.createElement("canvas");c.width=S;c.height=1380;const ctx=c.getContext("2d");
 ctx.fillStyle="#eefaff";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#18364a";ctx.textAlign="center";
 ctx.font="bold 58px sans-serif";ctx.fillText("ジュニア 好き顔9選",S/2,82);
 for(let i=0;i<ids.length;i++){let img=new Image();img.src=byId(ids[i]).src;await img.decode();

  let sw=img.width,sh=img.height,ss=Math.min(sw,sh),sx=(sw-ss)/2,sy=(sh-ss)/2;ctx.drawImage(img,sx,sy,ss,ss,x,y,cell,cell)}

};
